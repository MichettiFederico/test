<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargar estrategia Python</title>
  <style>
    :root{
      --bg:#0f172a;
      --panel:#111827;
      --panel-2:#1f2937;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --line:#334155;
      --accent:#60a5fa;
      --good:#34d399;
      --warn:#fbbf24;
      --danger:#f87171;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font:16px/1.5 system-ui, sans-serif;
      padding:24px;
    }
    .wrap{
      max-width:1100px;
      margin:0 auto;
    }
    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      padding:18px;
      margin-bottom:18px;
    }
    h1{
      margin:0 0 8px;
      font-size:2rem;
    }
    p{
      color:var(--muted);
      margin:8px 0 0;
    }
    input[type=file], button, textarea{
      width:100%;
      border-radius:10px;
      border:1px solid var(--line);
      background:var(--panel-2);
      color:var(--text);
      font:inherit;
      padding:12px 14px;
    }
    button{
      cursor:pointer;
      background:var(--accent);
      color:#07111f;
      border:none;
      font-weight:700;
      transition:filter .15s ease;
    }
    button:hover{ filter:brightness(1.05); }
    textarea{
      width:100%;
      min-height:420px;
      resize:vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:14px;
      line-height:1.5;
      padding:16px;
    }
    .row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      align-items:center;
    }
    .status{
      margin-top:12px;
      font-size:0.95rem;
      color:var(--good);
    }
    .status.warn{ color:var(--warn); }
    .status.err{ color:var(--danger); }
    .note{
      border-left:3px solid var(--accent);
      padding-left:12px;
      color:var(--muted);
      margin-top:12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>Cargar estrategia Python</h1>
      <p>Esta página solo carga y muestra el archivo Python. No puede ejecutarlo ni leer `.env` desde el navegador por seguridad.</p>
      <div class="note">
        Para correr la estrategia y traer velas reales desde Binance, se usa un script Python local que lee el archivo <code>.env</code>.
      </div>
    </div>

    <div class="panel">
      <div class="row">
        <input id="fileInput" type="file" accept=".py" />
        <button id="loadExampleBtn" type="button">Cargar ejemplo</button>
      </div>
      <div id="status" class="status">Sin archivo cargado.</div>
    </div>

    <div class="panel">
      <textarea id="code" spellcheck="false" aria-label="Contenido del archivo .py"></textarea>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const statusEl = document.getElementById("status");
    const codeEl = document.getElementById("code");

    const examplePython = `import os
import asyncio
import ccxt

# Este es solo un ejemplo visible en la página.
# La página no puede ejecutarlo.

print("Este archivo .py fue cargado desde el navegador.")
`;

    document.getElementById("loadExampleBtn").addEventListener("click", () => {
      codeEl.value = examplePython;
      fileInput.value = "";
      statusEl.textContent = "Ejemplo cargado para visualización.";
      statusEl.className = "status";
    });

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) {
        statusEl.textContent = "No se seleccionó ningún archivo.";
        statusEl.className = "status err";
        return;
      }

      if (!file.name.toLowerCase().endsWith(".py")) {
        statusEl.textContent = "Solo se permiten archivos .py";
        statusEl.className = "status err";
        return;
      }

      try {
        const text = await file.text();
        codeEl.value = text;
        statusEl.textContent = `Archivo cargado: ${file.name}`;
        statusEl.className = "status";
      } catch (error) {
        statusEl.textContent = "No se pudo leer el archivo.";
        statusEl.className = "status err";
      }
    });
  </script>
</body>
</html>
