<title>Banco de Pruebas Intradiario</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#14202E; --ink-2:#4F6075; --line:#D5DCE5; --grid:#E4E9EF;
  --accent:#2744E0; --accent-ink:#FFFFFF; --accent-soft:#E3E8FD;
  --gain:#0B8A5D; --gain-soft:#DAF1E6; --loss:#CB2C48; --loss-soft:#FBE1E6;
  --warn:#8F4D00; --warn-soft:#FFEFD2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151D; --surface:#151F2A; --surface-2:#1A2633; --ink:#E6ECF3; --ink-2:#9CAEC2; --line:#2A3846; --grid:#223040;
    --accent:#8DA3FF; --accent-ink:#0B1230; --accent-soft:#1E2A57;
    --gain:#3AD4A0; --gain-soft:#12372B; --loss:#FF7389; --loss-soft:#41202A;
    --warn:#F0A44B; --warn-soft:#3A2A12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151D; --surface:#151F2A; --surface-2:#1A2633; --ink:#E6ECF3; --ink-2:#9CAEC2; --line:#2A3846; --grid:#223040;
  --accent:#8DA3FF; --accent-ink:#0B1230; --accent-soft:#1E2A57;
  --gain:#3AD4A0; --gain-soft:#12372B; --loss:#FF7389; --loss-soft:#41202A;
  --warn:#F0A44B; --warn-soft:#3A2A12; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1520px;margin:0 auto}
h1{font:700 clamp(26px,4vw,38px)/1.05 var(--font-display);letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
h2{font:600 11px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:0 0 12px}
.lede{margin:0;max-width:70ch;color:var(--ink-2)}
.top{margin-bottom:18px}
.app{display:grid;grid-template-columns:minmax(330px,440px) minmax(0,1fr);gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:980px){.app{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.hint{color:var(--ink-2);font-size:12.5px;margin:8px 0 0}
.runbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 6px 16px -10px rgba(10,20,40,.35)}
.runbar .status{flex:1 1 140px;min-width:0;font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.progress{flex-basis:100%;height:3px;background:var(--grid);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .12s linear}
.btn{font:600 13px/1 var(--font-body);border-radius:7px;padding:10px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-2);filter:none}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
input[type=checkbox]{width:auto}
input[type=file]{display:none}
label{font-size:12px;color:var(--ink-2);display:block;margin-bottom:4px}
.seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px;margin-bottom:12px}
.seg button{flex:1;font:500 12.5px var(--font-body);padding:7px 6px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.drop{display:block;border:1.5px dashed var(--line);border-radius:8px;padding:18px 12px;text-align:center;color:var(--ink-2);cursor:pointer;font-size:13px;margin:0}
.drop.over,.drop:hover{border-color:var(--accent);color:var(--accent)}
.datainfo{font:12px/1.5 var(--font-mono);color:var(--ink-2);margin:12px 0 0;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:10px}
.row>div{flex:1 1 150px;min-width:0}
textarea#code{font:12.5px/1.55 var(--font-mono);min-height:340px;resize:vertical;white-space:pre;overflow:auto;tab-size:2;background:var(--surface-2)}
details summary{cursor:pointer;font-size:12.5px;color:var(--accent);margin-top:10px}
details.api{font-size:12.5px;color:var(--ink-2)}
details.api ul{margin:8px 0 0;padding-left:18px}
details.api li{margin:3px 0}
code{font-family:var(--font-mono);font-size:.92em;background:var(--surface-2);padding:1px 4px;border-radius:4px;color:var(--ink)}
.note{border-radius:8px;padding:10px 12px;font-size:13px;margin:0 0 12px;border:1px solid var(--line);background:var(--surface-2)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.err{background:var(--loss-soft);border-color:transparent;color:var(--loss)}
.note.ok{background:var(--gain-soft);border-color:transparent;color:var(--gain)}
.note b{font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.kpi .v{font:500 22px/1.2 var(--font-mono);margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font:12px var(--font-mono);color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
.pos{color:var(--gain)} .neg{color:var(--loss)}
.chart{position:relative;margin:0}
.chart canvas{display:block;width:100%;height:280px;touch-action:pan-y}
.chart.short canvas{height:210px}
.vline{position:absolute;top:0;bottom:0;width:1px;background:var(--ink-2);opacity:.45;pointer-events:none}
.tip{position:absolute;top:6px;z-index:3;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:12px/1.5 var(--font-mono);box-shadow:0 6px 18px -8px rgba(0,0,0,.45);white-space:nowrap}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
dl.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 28px;margin:0}
dl.stats div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--grid)}
dl.stats dt{color:var(--ink-2)}
dl.stats dd{margin:0;font:500 13px var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.tablewrap{overflow:auto;max-height:380px;border:1px solid var(--line);border-radius:8px;margin-top:10px}
table{border-collapse:collapse;width:100%;font:12.5px var(--font-mono);font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--surface-2);text-align:right;font:600 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:8px
